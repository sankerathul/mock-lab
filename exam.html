<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Practice test · Mock Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>body{margin:0}</style>
<style>
/* Layout: test-centre console. Dark slate status bar on top, one centred question column, a single-line question navigator, sticky action bar at the bottom. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#17212b; --muted:#56636f; --line:#d3dae1; --line-strong:#a9b4bf;
  --accent:#1d5a8c; --accent-ink:#ffffff; --accent-soft:#dfeaf5; --accent-soft-ink:#164a74;
  --flag:#a35f00; --flag-soft:#fbecd2; --flag-line:#e0a64b;
  --ok:#1e7a4a; --ok-soft:#e1f2e8; --bad:#b3261e; --bad-soft:#f9e3e1;
  --bar:#1b2733; --bar-ink:#eef2f6; --bar-muted:#a9b6c3;
  --font-ui:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --panel:#17212b; --ink:#e4eaf0; --muted:#9aa7b4; --line:#2b3743; --line-strong:#4a5866;
  --accent:#6aa6dc; --accent-ink:#0d1620; --accent-soft:#1b3349; --accent-soft-ink:#a9cdee;
  --flag:#f0b252; --flag-soft:#3b2c12; --flag-line:#8a6424;
  --ok:#62c48f; --ok-soft:#15301f; --bad:#f08a80; --bad-soft:#3a1b19;
  --bar:#0a1016; --bar-ink:#e4eaf0; --bar-muted:#8d9aa7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --panel:#17212b; --ink:#e4eaf0; --muted:#9aa7b4; --line:#2b3743; --line-strong:#4a5866;
  --accent:#6aa6dc; --accent-ink:#0d1620; --accent-soft:#1b3349; --accent-soft-ink:#a9cdee;
  --flag:#f0b252; --flag-soft:#3b2c12; --flag-line:#8a6424;
  --ok:#62c48f; --ok-soft:#15301f; --bad:#f08a80; --bad-soft:#3a1b19;
  --bar:#0a1016; --bar-ink:#e4eaf0; --bar-muted:#8d9aa7; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.only-short{display:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button{font:inherit;color:inherit}
code.t{font-family:var(--font-mono);font-size:.88em;background:var(--accent-soft);color:var(--accent-soft-ink);padding:0 .25em;border-radius:3px;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;gap:.45rem;min-height:40px;padding:.45rem 1rem;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--panel);cursor:pointer;font-weight:500;font-size:.95rem}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,.qn:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.flag-on{background:var(--flag-soft);border-color:var(--flag-line);color:var(--flag)}
.btn svg{width:16px;height:16px;flex:none}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* status bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink)}
.bar .wrap{display:flex;align-items:center;gap:1rem;min-height:52px;padding-block:.4rem;max-width:1100px}
.bar .name{font-weight:600;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .name span{color:var(--bar-muted);font-weight:400}
.bar .count{font-size:.9rem;color:var(--bar-muted);white-space:nowrap}
.timer{display:flex;align-items:baseline;gap:.5rem;white-space:nowrap}
.timer small{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--bar-muted)}
.timer b{font-family:var(--font-mono);font-weight:500;font-size:1.25rem;font-variant-numeric:tabular-nums}
.timer.low b{color:#ffb4a8}

/* navigator */
.navwrap{background:var(--panel);border-bottom:1px solid var(--line)}
.navwrap .wrap{max-width:1100px;padding-block:.5rem}
.stripwrap{position:relative;margin-bottom:.35rem}
.stripwrap::before,.stripwrap::after{content:"";position:absolute;top:0;bottom:0;width:48px;z-index:2;pointer-events:none}
.stripwrap::before{left:0;background:linear-gradient(to right,var(--panel),transparent)}
.stripwrap::after{right:0;background:linear-gradient(to left,var(--panel),transparent)}
.strip{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:6px calc(50% - 17px);scrollbar-width:none;-ms-overflow-style:none}
.strip::-webkit-scrollbar{display:none}
.lens{position:absolute;left:50%;top:3px;width:40px;height:40px;margin-left:-20px;border:2px solid var(--ink);border-radius:8px;pointer-events:none;z-index:3}
.sep{flex:none;font-size:.7rem;font-weight:600;color:var(--muted);padding:0 .35rem 0 .6rem;letter-spacing:.04em}
.sep:first-child{padding-left:0}
.sep{scroll-snap-align:none}
.qn{position:relative;flex:none;width:34px;height:34px;border:1px solid var(--line-strong);border-radius:5px;background:var(--panel);font-family:var(--font-mono);font-size:.8rem;cursor:pointer;font-variant-numeric:tabular-nums}
.qn.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-soft-ink)}
.qn.flg{background:var(--flag-soft);border-color:var(--flag-line);color:var(--flag)}
.qn.flg.ans::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.qn.cur{font-weight:600}
.grid .qn.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:.35rem 1rem;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--line-strong);background:var(--panel)}
.sw.a{background:var(--accent-soft);border-color:var(--accent)}
.sw.f{background:var(--flag-soft);border-color:var(--flag-line)}
.sw.c{border:2px solid var(--ink);background:transparent;border-radius:4px}

/* question */
main{padding-block:1.25rem 7rem}
.scn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:1rem}
.scn summary{cursor:pointer;padding:.65rem .9rem;font-size:.9rem;font-weight:500;list-style:none;display:flex;gap:.5rem;align-items:center}
.scn summary::-webkit-details-marker{display:none}
.scn summary::before{content:"";width:0;height:0;border-left:5px solid var(--muted);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.scn[open] summary::before{transform:rotate(90deg)}
.scn p{margin:0;padding:0 .9rem .85rem;font-size:.92rem;color:var(--muted);max-width:70ch}
.qline{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-bottom:.6rem;margin-bottom:.9rem;border-bottom:1px solid var(--line)}
.qline h2{margin:0;font-size:1.05rem;font-weight:600;white-space:nowrap}
.qline h2 span{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:.5rem}
.stem{font-size:1.05rem;margin:0 0 .5rem;max-width:72ch}
.instr{font-size:.85rem;font-weight:600;color:var(--muted);margin:0 0 .9rem}
.instr.err{color:var(--bad)}
.opts{display:grid;gap:.55rem}
.opt{display:grid;grid-template-columns:auto 1fr;gap:.75rem;align-items:start;width:100%;text-align:left;padding:.75rem .9rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;font-size:.98rem;line-height:1.5}
.opt:hover{border-color:var(--line-strong)}
.opt .lt{display:grid;place-items:center;width:28px;height:28px;border:1.5px solid var(--line-strong);border-radius:50%;font-family:var(--font-mono);font-size:.8rem;font-weight:500;color:var(--muted)}
.opt.multi .lt{border-radius:5px}
.opt.sel{border:2px solid var(--accent);background:var(--accent-soft);padding:calc(.75rem - 1px) calc(.9rem - 1px)}
.opt.sel .lt{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt span:last-child{min-width:0}

/* action bar */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.actions .wrap{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding-block:.6rem;max-width:1100px}
.actions .grow{flex:1}
.actions .grow{text-align:center}
.btn.next{min-width:7.5rem;justify-content:center}
.btn.prev{min-width:7.5rem;justify-content:center}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--line-strong)}
.btn.onbar{background:transparent;color:var(--bar-ink);border-color:var(--bar-muted);min-height:34px;padding:.3rem .8rem;font-size:.85rem}
.btn.onbar:hover{border-color:var(--bar-ink)}
.pace{display:flex;align-items:baseline;gap:.9rem;white-space:nowrap;font-size:.85rem;color:var(--bar-muted)}
.pace b{font-family:var(--font-mono);font-weight:500;color:var(--bar-ink);font-size:1rem;font-variant-numeric:tabular-nums;margin-left:.3rem}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:.6rem}
.mode{display:grid;gap:.2rem;text-align:left;padding:.85rem 1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer}
.mode b{font-size:1rem}
.mode span{font-size:.85rem;color:var(--muted)}
.mode[aria-checked="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:calc(.85rem - 1px) calc(1rem - 1px)}
.mode[aria-checked="true"] span{color:var(--accent-soft-ink)}
.timing{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));gap:.6rem}
.slow{display:grid;gap:.25rem;margin:0;padding:0;list-style:none;font-size:.9rem}
.slow li{display:flex;justify-content:space-between;gap:.75rem;border-bottom:1px solid var(--line);padding:.35rem 0}
.slow li span:last-child{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.kbd{font-size:.75rem;color:var(--muted)}

/* cards and screens */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.25rem 1.25rem}
.hero{padding-block:2rem 3rem;display:grid;gap:1.25rem}
.hero h1{font-size:clamp(1.6rem,4vw,2.1rem);line-height:1.2;margin:0;font-weight:600;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5rem),1fr));gap:.6rem}
.fact{border:1px solid var(--line);border-radius:var(--r);padding:.65rem .8rem;background:var(--bg)}
.fact b{display:block;font-family:var(--font-mono);font-size:1.25rem;font-weight:500;font-variant-numeric:tabular-nums}
.fact span{font-size:.8rem;color:var(--muted)}
.rules{margin:0;padding-left:1.1rem;display:grid;gap:.35rem;max-width:70ch}
.scnlist{display:grid;gap:.5rem;margin:0;padding:0;list-style:none;counter-reset:s}
.scnlist li{display:grid;grid-template-columns:auto 1fr;gap:.6rem;font-size:.92rem}
.scnlist li::before{counter-increment:s;content:counter(s);font-family:var(--font-mono);font-size:.8rem;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:4px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.note{font-size:.88rem;padding:.65rem .8rem;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-soft-ink)}
.note.warn{background:var(--flag-soft);color:var(--flag)}
.note.okn{background:var(--ok-soft);color:var(--ok)}
.note.badn{background:var(--bad-soft);color:var(--bad)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:.7rem .85rem;background:var(--bg)}
.stat span{font-size:.8rem;color:var(--muted)}
.stat b{display:block;font-family:var(--font-mono);font-size:1.5rem;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:.4rem 0 1rem}
.grid .qn{width:auto}

.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:1rem;align-items:center}
.big{font-family:var(--font-mono);font-size:clamp(2.6rem,9vw,3.6rem);font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.verdict{display:inline-block;font-weight:600;font-size:.85rem;padding:.2rem .6rem;border-radius:4px;letter-spacing:.03em}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}
.verdict.fail{background:var(--bad-soft);color:var(--bad)}
table.dt{width:100%;border-collapse:collapse;font-size:.9rem}
table.dt th{text-align:left;font-weight:600;color:var(--muted);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
table.dt td{padding:.55rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
table.dt td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.meter{position:relative;height:8px;border-radius:4px;background:var(--line);min-width:80px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--ok)}
.meter i.low{background:var(--bad)}
.meter::after{content:"";position:absolute;top:-3px;bottom:-3px;left:72%;width:2px;background:var(--ink);opacity:.55}
.tablewrap{overflow-x:auto}
.filters{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:1px solid var(--line-strong);background:var(--panel);border-radius:999px;padding:.25rem .8rem;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.rv{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:0;padding:.85rem 1rem;background:var(--panel)}
.rv.bad{border-left-color:var(--bad)}
.rv h3{margin:0 0 .35rem;font-size:.9rem;font-weight:600;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.rv h3 .tag{font-weight:500;font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 .4rem}
.rv p{margin:.25rem 0;font-size:.93rem;max-width:75ch}
.rv .ya{color:var(--muted)}
.rv .ex{color:var(--muted);font-size:.88rem}
.rvlist{display:grid;gap:.6rem}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:inherit}
pre.copy{white-space:pre-wrap;word-break:break-word;font-family:var(--font-mono);font-size:.78rem;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:.6rem;max-height:10rem;overflow:auto}
@media (max-width:560px){
  .bar .name span{display:none}
  .bar .count{display:none}
  .timer small,.pace .lbl{display:none}
  .bar .name{font-size:.85rem}
  .kbd{visibility:hidden}
  .only-long{display:none}
  .only-short{display:inline}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
/* strike-out */
.optrow{display:grid;grid-template-columns:1fr auto;gap:.4rem;align-items:stretch}
.opt.struck{opacity:.55}
.opt.struck .ot{text-decoration:line-through;text-decoration-thickness:1.5px}
.opt.struck .lt{border-style:dashed}
.strikebtn{width:36px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--muted);cursor:pointer;font-size:.85rem;opacity:.5}
.strikebtn:hover{opacity:1;border-color:var(--line-strong)}
.strikebtn[aria-pressed="true"]{opacity:1;background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.strikebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;opacity:1}
@media (hover:hover) and (pointer:fine){.optrow{grid-template-columns:1fr}.strikebtn{display:none}}
.bar a.home{color:var(--bar-ink);text-decoration:none}
.bar a.home:hover{text-decoration:underline}
.bar .name span{color:var(--bar-muted);font-weight:400}
a.btn{text-decoration:none;color:inherit}
.err-page{padding-block:3rem;display:grid;gap:1rem}
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <div class="wrap">
    <div class="name"><a class="home" href="index.html" title="All tests">Mock Lab</a> <span id="examName"></span></div>
    <div class="count" id="count"></div>
    <div class="timer" id="timer"><small>Time remaining</small><b id="clock"></b></div>
    <div class="pace" id="pace" hidden><span><span class="lbl">Active time</span><b id="activeClock">0:00:00</b></span><span><span class="lbl">This question</span><b id="qClock">0:00</b></span></div>
    <button class="btn onbar" id="reviewBtn" type="button"><span class="only-long">Review and submit</span><span class="only-short">Review</span></button>
  </div>
</div>

<div class="navwrap" id="navwrap" hidden>
  <div class="wrap">
    <div class="stripwrap"><div class="strip" id="strip" aria-label="Question navigator"></div><div class="lens" aria-hidden="true"></div></div>
    <div class="legend"><span><i class="sw a"></i>Answered</span><span><i class="sw f"></i>Marked for review</span><span><i class="sw"></i>Not answered</span><span><i class="sw c"></i>Current</span></div>
  </div>
</div>

<main class="wrap" id="screen"></main>

<div class="actions" id="actions" hidden>
  <div class="wrap">
    <button class="btn prev" id="prevBtn" type="button">Previous</button>
    <span class="grow"><span class="kbd">Keys: A–E select · Shift+A–E strike out · ← → move · M mark · Right-click to strike out</span></span>
    <button class="btn primary next" id="nextBtn" type="button">Next</button>
  </div>
</div>

<script src="exams/catalog.js"></script>
<script>
/* Load the test named in the URL (exam.html?id=mock1), then start the exam app. */
(function () {
  var id = new URLSearchParams(location.search).get("id") || "";
  var entry = (window.CATALOG || []).find(function (c) { return c.id === id; });
  if (!entry) {
    var m = document.getElementById("screen");
    m.innerHTML = '<section class="err-page"><h1>Test not found</h1><p class="muted">This link doesn\'t match any test.</p><p><a class="btn primary" href="index.html">See all tests</a></p></section>';
    return;
  }
  var s = document.createElement("script");
  s.src = "exams/" + entry.id + ".js";
  s.onload = function () { document.title = EXAM.title + " · Mock Lab"; document.getElementById("examName").textContent = "· " + EXAM.title; startApp(); };
  s.onerror = function () { document.getElementById("screen").innerHTML = '<section class="err-page"><h1>Couldn\'t load this test</h1><p><a class="btn" href="index.html">Back to all tests</a></p></section>'; };
  document.head.appendChild(s);
})();
function startApp() {
const EXAM_ID = EXAM.id, EXAM_TITLE = EXAM.title, INTRO = EXAM.intro;
const IDLE = 180;
const LS_KEY = "openexam-" + EXAM_ID + "-progress-v1";
const Q = EXAM.questions, SC = EXAM.scenarios;
const MULTI_COUNT = Q.filter((q) => Array.isArray(q.a)).length;
const N = Q.length, LIMIT = N * 120, PASS = Math.ceil(N * 0.72);
const BLOCKS = SC.map((_, s) => Q.map((q, k) => (q.s === s ? k : -1)).filter((k) => k >= 0));
const L = (k) => String.fromCharCode(65 + k);
const isMulti = (q) => Array.isArray(q.a);
const FLAG_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3.5 14V2.5M3.5 3h8l-1.6 2.8L11.5 8.6h-8"/></svg>';
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const blankAnswers = () => Q.map((q) => (isMulti(q) ? [] : null));
const S = { view: "start", mode: "timed", pickMode: "timed", i: 0, startedAt: null, answers: blankAnswers(), flags: [], qtime: Q.map(() => 0), strikes: Q.map(() => []), reviewSec: 0, submitted: null, armed: false, scnOpen: true, filter: "all" };
let tick = null, remoteResume = null, lastResult = null, lastActive = Date.now(), tickCount = 0;

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const answered = (k) => (isMulti(Q[k]) ? S.answers[k].length === 2 : S.answers[k] !== null);
const correct = (k) => { const q = Q[k], a = S.answers[k]; return isMulti(q) ? a.length === 2 && q.a.every((x) => a.includes(x)) : a === q.a; };
